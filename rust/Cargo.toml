[workspace]
resolver = "2"
members = ["crates/flash-cjk-core", "crates/flash-cjk-search"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
